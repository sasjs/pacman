name: Release

on:
  push:
    branches:
      - main
  # a release that died after cutting the tag is re-runnable; nothing is
  # committed back, so a second run finishes it rather than duplicating it
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    # the release makes a tag and a release, and nothing is committed back
    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # the version comes from the tags, and a depth-1 clone has none
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          CI: true

      # `sasjs cb` clears the folder it writes before it writes, so the file is
      # copied out before the next target builds over it. What a release
      # publishes is the `release` block in sasjs/sasjsconfig.json.
      - name: Build the SAS 9 EBI deployment program
        run: |
          mkdir -p artefacts
          npx sasjs cb -t sas9
          cp ./sasjsbuild/sas9.sas ./artefacts/sas9.sas
          test -s ./artefacts/sas9.sas

      - name: Build the Viya deployment program
        run: |
          npx sasjs cb -t viya
          cp ./sasjsbuild/viya.sas ./artefacts/viya.sas
          test -s ./artefacts/viya.sas

      # The streamed app: the same command also builds the mock site into
      # sasjsbuild/mock (streamConfig.mockWeb), which is not a release asset -
      # the pack is, because deploying it is what publishes the app at /app.
      - name: Build the SASjs deploy package
        run: |
          npx sasjs cb -t server
          cp ./sasjsbuild/server.json.zip ./artefacts/server.json.zip
          test -s ./artefacts/server.json.zip

      # @sasjs/release is a devDependency, so the version that runs is the one
      # in package-lock.json. It refuses to tag or release when a configured
      # asset is missing, which is how a build that silently produced nothing is
      # caught here rather than by the first person to import the zip.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx sasjs-release --release
