name: Release

on:
  push:
    branches:
      - main
  # a release that died after cutting the tag is re-runnable; nothing is
  # committed back, so a second run finishes it rather than duplicating it
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    # the release makes a tag and a release, and nothing is committed back
    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # the version comes from the tags, and a depth-1 clone has none
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          CI: true

      # the same script the pull-request check runs, so what a release uploads
      # is what a pull request built and checked
      - name: Build the release artefacts
        run: bash scripts/build-artefacts.sh

      - name: Check what the artefacts say
        run: npm run check:artefacts

      # @sasjs/release is a devDependency, so the version that runs is the one
      # in package-lock.json. It refuses to tag or release when a configured
      # asset is missing, which is how a build that silently produced nothing is
      # caught here rather than by the first person to import the zip.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx sasjs-release --release
